name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # engines.node >=24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make ci

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Keep this tag equal to the installed @playwright/test version (pnpm exec playwright --version).
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # The Playwright image ships without make.
      - run: apt-get update && apt-get install -y --no-install-recommends make
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: make e2e
        env:
          STEP_SENTENCES: 1 # the slow step-sentence check, skipped locally by default
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
