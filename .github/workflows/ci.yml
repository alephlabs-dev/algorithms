name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a PR touches code. Pushes to main always run everything.
  # The other jobs skip when code is "false"; GitHub counts a skipped required check as passed.
  # If this job fails, code is empty and everything runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2 # the PR merge commit and its base parent
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            case "$f" in
              # Files nothing in the build or tests reads. Keep this list short and safe.
              *.md|.claude/*|docs/*|LICENSE.txt|.github/workflows/claude.yml|.github/workflows/maintenance.yml) ;;
              *) code=true; echo "code change: $f"; break ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo code=$code >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # engines.node >=24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make ci

  e2e-device:
    name: e2e (${{ matrix.project }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # one device failing shouldn't hide the others' results
      matrix:
        project: [iphone, ipad, ipad-landscape, desktop]
    container:
      # Keep this tag equal to the installed @playwright/test version (pnpm exec playwright --version).
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # The Playwright image ships without make.
      - run: apt-get update && apt-get install -y --no-install-recommends make
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: make e2e ARGS=--project=${{ matrix.project }}
        env:
          STEP_SENTENCES: 1 # the slow step-sentence check, skipped locally by default
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 7

  # The ruleset on main requires a check named "e2e"; this job keeps that name for the matrix above.
  e2e:
    needs: [changes, e2e-device]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          result="${{ needs.e2e-device.result }}"
          code="${{ needs.changes.outputs.code }}"
          test "$result" = success || { test "$result" = skipped && test "$code" = false; }
