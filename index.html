<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Page-specific tags hold the home page's values. The build writes one HTML
      file per page with its own values (see src/seo/head.ts); keep each tag on
      one line with `content` right after the name, so that rewrite finds it.
    -->
    <title>Algorithm Visualizer: Sorting, Graphs, Data Structures, DP and More · Aleph Labs</title>
    <meta name="description" content="Watch sorts, A*, Dijkstra, AVL rotations, hash tables, Fourier circles and dynamic programming tables work step by step, with pseudocode and plain-language explanations." />
    <link rel="canonical" href="https://algorithms-aleph.vercel.app/" />
    <meta name="theme-color" content="#0b0f0d" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint, so the page never flashes the other one.
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').content = "#f2f5f9";
        }
      } catch {}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aleph Labs Algorithms" />
    <meta property="og:title" content="Algorithm Visualizer: Sorting, Graphs, Data Structures, DP and More · Aleph Labs" />
    <meta property="og:description" content="Watch sorts, A*, Dijkstra, AVL rotations, hash tables, Fourier circles and dynamic programming tables work step by step, with pseudocode and plain-language explanations." />
    <meta property="og:url" content="https://algorithms-aleph.vercel.app/" />
    <meta property="og:image" content="https://algorithms-aleph.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Algorithm Visualizer: Sorting, Graphs, Data Structures, DP and More · Aleph Labs" />
    <meta name="twitter:description" content="Watch sorts, A*, Dijkstra, AVL rotations, hash tables, Fourier circles and dynamic programming tables work step by step, with pseudocode and plain-language explanations." />
    <meta name="twitter:image" content="https://algorithms-aleph.vercel.app/og.png" />
    <script type="application/ld+json" id="structured-data">{}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
